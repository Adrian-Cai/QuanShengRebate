services:
  quansheng:
    build:
      context: .
    environment:
      QUANSHENG_UPSTREAM: live
      PORT: "3000"
      TAOBAO_APP_KEY: "${TAOBAO_APP_KEY:?TAOBAO_APP_KEY is required}"
      TAOBAO_APP_SECRET: "${TAOBAO_APP_SECRET:?TAOBAO_APP_SECRET is required}"
      TAOBAO_ADZONE_ID: "${TAOBAO_ADZONE_ID:?TAOBAO_ADZONE_ID is required}"
      TAOBAO_MATERIAL_ID_RECOMMEND: "${TAOBAO_MATERIAL_ID_RECOMMEND:?TAOBAO_MATERIAL_ID_RECOMMEND is required}"
      QUANSHENG_PRODUCT_REF_KEY: "${QUANSHENG_PRODUCT_REF_KEY:?QUANSHENG_PRODUCT_REF_KEY is required}"
      TAOBAO_SITE_ID: "${TAOBAO_SITE_ID:-}"
      TAOBAO_MATERIAL_ID_SEARCH: "${TAOBAO_MATERIAL_ID_SEARCH:-}"
      TAOBAO_GATEWAY: "${TAOBAO_GATEWAY:-https://gw.api.taobao.com/router/rest}"
      TAOBAO_SIGN_METHOD: "${TAOBAO_SIGN_METHOD:-md5}"
      QUANSHENG_CACHE_TTL_MS: "${QUANSHENG_CACHE_TTL_MS:-45000}"
    ports:
      - "127.0.0.1:3000:3000"
